name: Docker Install Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.2) — used for image tags'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/extphprs/grpc-php-rs

jobs:
  build-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        ts: ['nts', 'zts']
        libc: ['glibc', 'musl']
        exclude:
          # PHP 8.6+ official images are ZTS only: there is no NTS build and no
          # -zts tag (docker-library/php#1686), so php:8.6-cli is already ZTS.
          - php: '8.6'
            ts: 'nts'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version and PHP image
        id: meta
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # PHP 8.6+ official images are ZTS only: the plain tags (cli, alpine)
          # are already thread-safe and there is no -zts tag to use.
          BASE_ZTS_TAG="-zts"
          if [[ "$(printf '%s\n' "${{ matrix.php }}" 8.6 | sort -V | head -1)" == "8.6" ]]; then
            BASE_ZTS_TAG=""
          fi

          if [[ "${{ matrix.libc }}" == "musl" ]]; then
            ALPINE_SUFFIX="-alpine"
            DOCKERFILE="docker/Dockerfile.alpine"
            if [[ "${{ matrix.ts }}" == "zts" ]]; then
              echo "php_image=php:${{ matrix.php }}${BASE_ZTS_TAG}-alpine" >> "$GITHUB_OUTPUT"
            else
              echo "php_image=php:${{ matrix.php }}-alpine" >> "$GITHUB_OUTPUT"
            fi
          else
            ALPINE_SUFFIX=""
            DOCKERFILE="docker/Dockerfile"
            if [[ "${{ matrix.ts }}" == "zts" ]]; then
              if [[ -n "$BASE_ZTS_TAG" ]]; then
                echo "php_image=php:${{ matrix.php }}-zts" >> "$GITHUB_OUTPUT"
              else
                echo "php_image=php:${{ matrix.php }}-cli" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "php_image=php:${{ matrix.php }}-cli" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Image tags follow the base images: no -zts suffix when there is no
          # NTS/ZTS distinction (8.6+), so the tag is just latest-php8.6[-alpine].
          if [[ "${{ matrix.ts }}" == "zts" && -n "$BASE_ZTS_TAG" ]]; then
            TS_SUFFIX="-zts"
          else
            TS_SUFFIX=""
          fi

          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=${ALPINE_SUFFIX}${TS_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHP_IMAGE=${{ steps.meta.outputs.php_image }}
          labels: |
            org.opencontainers.image.source=https://github.com/extphprs/grpc-php-rs
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-php${{ matrix.php }}${{ steps.meta.outputs.tag_suffix }}
            ${{ env.IMAGE }}:latest-php${{ matrix.php }}${{ steps.meta.outputs.tag_suffix }}
          cache-from: type=gha,scope=php${{ matrix.php }}-${{ matrix.ts }}-${{ matrix.libc }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}-${{ matrix.ts }}-${{ matrix.libc }}
